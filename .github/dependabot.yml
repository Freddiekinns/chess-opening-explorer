version: 2

# Grouping is the whole point here. Ungrouped, a workspace this size opens
# twenty PRs a week and they get ignored as a block; the security updates that
# matter then arrive looking exactly like the noise. So routine version bumps
# are batched into two PRs per ecosystem, and security updates are left
# deliberately ungrouped so they show up on their own and read as urgent.
#
# Majors are not ignored. They need real work rather than a merge, and a PR each
# is how they stay visible — which also means never closing one to tidy the
# list, because a closed Dependabot PR stops being re-proposed at that version.
# Closing suppresses only the version closed, so a package that is blocked on
# tracked work comes straight back on its next release: #76 was closed at 08:01
# on 2026-08-29 and returned as #89 twenty-two minutes later, same change, same
# failure.
#
# Outstanding as of 2026-08-31, triage on each PR:
#   - typescript 7 (#107), the native port. `baseUrl` is gone and `paths` must
#     be relative, and typescript-eslint peers typescript <6.1.0 (8.68.0 is
#     latest and still does), so the bump cannot land before that moves.
#
# react-router 7 (#102) was on this list and landed, along with helmet 8 (#98),
# googleapis 176 (#100), lucide-react 1 (#108), express 5 (#114) and jest 30
# (#117); eslint 10 (#77), eslint-plugin-react-hooks 7 (#78) and react-refresh
# 0.5 landed with the flat-config migration, and so did sqlite3 6.
#
# jsdom 30 came off it too, but only after two changes that were not the bump:
# CI moved off Node 20, EOL since 2026-03-24 and the reason all 61 vitest
# workers died with `webidl.util.markAsUncloneable is not a function`, and three
# filter triggers stopped deriving their accessible name from CSS the test
# environment never loads. It paid for itself — the frontend job went 2m01s to
# 1m16s and `testTimeout` went back to the default.
#
# The vite/vitest cluster came off this list together, because each half of it
# was unmergeable alone: vite 8 (#99) broke the build on `manualChunks`,
# @vitejs/plugin-react 6 (#116) wanted a `vite/internal` subpath that vite 5
# does not export, and @vitest/coverage-v8 4 (#106) was green only because npm
# hoisted vitest 4 to the root and left `packages/web` and `packages/shared`
# still declaring `^1.0.4` — the same silently-wrong tree that cost the whole
# frontend suite in #100.
#
# Three majors were answered by a PR rather than merged, which is the shape to
# reach for when the bump alone is wrong. google-auth-library 11 (#101): the
# root declared it without importing it, so #104 dropped the dependency and the
# PR went with it. glob 13 (#125) was the same story — nothing in the repo has
# ever imported it, and removing the declaration takes it out of the tree
# entirely rather than leaving a transitive copy. express 5 (#109): green on every check for a change that
# throws at require time, so #114 carried the bump together with the route fix
# and #113 added the guard that catches it. Neither suppresses a version, which
# is why neither is an `ignore` entry. See
# docs/reviews/2026-08-28-dependency-security-scanning.md for the original
# reasoning and docs/reviews/2026-08-29-dependabot-triage.md for the first pass
# through the backlog.

updates:
  # One lockfile at the root covers every workspace, so a single npm entry
  # picks up packages/web, packages/api, packages/shared and the tools.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    # Back to 5 on 2026-08-31, the condition the 10 was raised under: the major
    # backlog is drained, and ten open PRs is ten CI runs and ten preview
    # deploys every time main moves. Raise it again to drain a backlog, not to
    # run one — the reason to is coupling, because majors are the PRs that turn
    # out to peer one another and only the ones open at the same time can be
    # seen to. vite 8 (#99), @vitest/coverage-v8 4 (#106) and
    # @vitejs/plugin-react 6 (#116) were diagnosable as one change only because
    # all three were open at once; had the limit hidden #116, #106 would have
    # landed a tree npm could not satisfy.
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # The `ignore` list is empty and the bar for adding to it is the same as
    # the security:audit allowlist: a reason, and the condition that deletes
    # the entry. Its one entry held eslint-plugin-react-refresh below 0.5,
    # because 0.5 drops eslintrc support and a 0.x minor rides along with every
    # future dev bump rather than being filed as a standalone major — one
    # package taking the whole group red, weekly. Flat config landed, so it is
    # gone.
    groups:
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  # tools/analysis is the Lichess popularity pipeline.
  - package-ecosystem: pip
    directory: /tools/analysis
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Pinned action majors go stale quietly and are a supply-chain surface in
  # their own right. Monthly, all in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
