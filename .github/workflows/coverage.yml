name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage summary not found"
            exit 1
          fi

          # Extract coverage percentages
          BRANCHES=$(jq '.total.branches.pct' coverage/coverage-summary.json)
          FUNCTIONS=$(jq '.total.functions.pct' coverage/coverage-summary.json)
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          STATEMENTS=$(jq '.total.statements.pct' coverage/coverage-summary.json)

          echo "Coverage: Branches: $BRANCHES%, Functions: $FUNCTIONS%, Lines: $LINES%, Statements: $STATEMENTS%"

          # Check if all are >= 90%
          if (( $(echo "$BRANCHES < 90" | bc -l) )); then
            echo "Branch coverage is below 90%"
            exit 1
          fi
          if (( $(echo "$FUNCTIONS < 90" | bc -l) )); then
            echo "Function coverage is below 90%"
            exit 1
          fi
          if (( $(echo "$LINES < 90" | bc -l) )); then
            echo "Line coverage is below 90%"
            exit 1
          fi
          if (( $(echo "$STATEMENTS < 90" | bc -l) )); then
            echo "Statement coverage is below 90%"
            exit 1
          fi

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Codecov v4 rejects tokenless uploads on protected branches; the
          # repo has no CODECOV_TOKEN, so the upload is best-effort and must
          # not fail the gate (matches ci.yml's backend codecov step).
          fail_ci_if_error: false

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
