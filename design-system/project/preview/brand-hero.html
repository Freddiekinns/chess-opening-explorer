<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:0;margin:0;background:var(--surface-base)}
.hero{padding:48px 24px 36px;background:linear-gradient(145deg,#232120 0%,#1a1816 100%);border-bottom:1px solid rgba(232,93,4,.20);text-align:center;position:relative}
.hero h1{font:800 56px/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;color:#ece8e1;margin:0 0 8px}
.hero h1 i{font-style:normal;color:#e85d04}
.hero p{font:400 18px/1.4 'DM Sans',sans-serif;color:#9a958e;margin:0 0 24px}
.search{max-width:560px;margin:0 auto;display:flex;gap:10px}
.search input{flex:1;padding:14px 20px;font-size:16px;text-align:center;background:linear-gradient(145deg,rgba(232,93,4,.06),transparent);border:1px solid rgba(232,93,4,.20);border-radius:12px;color:#ece8e1;outline:none;font-family:'DM Sans'}
.search input::placeholder{color:#8e887f}
.pgn{margin-top:14px;color:#9a958e;font-size:13px;background:none;border:none;font-family:'DM Sans';cursor:pointer;text-decoration:underline}
</style></head><body>
<section class="hero">
  <h1>Opening <i>Book</i></h1>
  <p>Discover, explore and learn chess openings.</p>
  <div class="search"><input placeholder="Search variations, ECO codes, or systems..."></div>
  <button class="pgn">Search by pasting PGN</button>
</section>
</body></html>
