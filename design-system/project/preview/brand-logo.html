<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base);display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:8px;padding:18px 22px;background:var(--surface-elevated);border:1px solid var(--border-subtle);border-radius:12px}
.lockup img{height:28px;margin:-2px 0}
.name{font:600 16px/1 var(--font-family-primary);color:var(--color-text-primary);letter-spacing:-.01em}
.panel{padding:14px;border-radius:12px;border:1px solid var(--border-subtle);background:var(--surface-raised)}
.panel img{display:block;width:96px;height:96px}
.light{background:#fff}
.sizes{display:flex;gap:14px;align-items:center}
.tile img{border-radius:22px}
.cap{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-muted);margin-top:6px}
</style></head><body>
<div><div class="lockup"><img src="../assets/logo-mark.svg" alt=""><span class="name">Opening Book</span></div><div class="cap">TopBar lockup</div></div>
<div><div class="panel"><img src="../assets/logo-mark.svg" alt=""></div><div class="cap">logo-mark</div></div>
<div><div class="panel light"><img src="../assets/logo-mark-black.svg" alt=""></div><div class="cap">one colour</div></div>
<div><div class="panel tile"><img src="../assets/logo-tile.svg" alt=""></div><div class="cap">logo-tile</div></div>
<div><div class="panel sizes" style="background:#dfe1e5"><img src="../assets/logo-favicon.svg" style="width:32px;height:32px" alt=""><img src="../assets/logo-favicon.svg" style="width:16px;height:16px" alt=""></div><div class="cap">favicon 32 / 16 — pages follow the OS colour scheme</div></div>
</body></html>
