<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base)}
.hero{display:flex;align-items:stretch;gap:14px;margin-bottom:14px}
.big{flex:0 0 240px;background:#e85d04;border-radius:var(--radius-md);padding:14px 16px;color:#100f0e;display:flex;flex-direction:column;justify-content:space-between;height:104px}
.big .lab{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.big .name{font:800 24px/1.1 'Bricolage Grotesque',sans-serif}
.big .hex{font-family:var(--font-family-mono);font-size:11px;opacity:.85}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1}
.s{border-radius:var(--radius-sm);padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-subtle);min-height:48px;font-size:10px;color:var(--color-text-secondary);font-family:var(--font-family-mono)}
.s b{font-family:var(--font-family-primary);color:var(--color-text-primary);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.usage{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--color-text-muted);padding-top:8px;border-top:1px solid var(--border-subtle)}
.usage .star{width:14px;height:14px;color:#e85d04;display:inline-flex;align-items:center;justify-content:center}
.btn-mini{display:inline-flex;align-items:center;padding:5px 12px;background:#e85d04;color:#100f0e;border-radius:6px;font-size:12px;font-weight:600}
.book-word{font:800 18px/1 'Bricolage Grotesque',sans-serif;color:#ece8e1}
.book-word i{color:#e85d04;font-style:normal}
</style></head><body>
<div class="hero">
  <div class="big"><span class="lab">brand orange</span><span class="name">Bookmark.</span><span class="hex">#e85d04</span></div>
  <div class="scale">
    <div class="s" style="background:rgba(232,93,4,.06)"><b>a6</b>0.06</div>
    <div class="s" style="background:rgba(232,93,4,.12)"><b>a12</b>0.12</div>
    <div class="s" style="background:rgba(232,93,4,.20)"><b>a20</b>0.20</div>
    <div class="s" style="background:rgba(232,93,4,.30)"><b>a30</b>0.30</div>
    <div class="s" style="background:rgba(232,93,4,.50)"><b>a50</b>0.50</div>
  </div>
</div>
<div class="usage">
  <span>Use only for:</span>
  <span class="btn-mini">Surprise me</span>
  <span class="book-word">Opening <i>Book</i></span>
  <span class="star">★</span>
  <span style="margin-left:auto;font-style:italic">Never as backgrounds, emphasis, or decoration.</span>
</div>
</body></html>
