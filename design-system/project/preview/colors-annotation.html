<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base);font-family:var(--font-family-primary);color:var(--color-text-secondary)}
.row{display:flex;gap:24px;align-items:center;font-size:12px;font-family:var(--font-family-mono)}
.row span{display:flex;align-items:center;gap:10px}
.solid{width:40px;height:6px;border-radius:3px;background:var(--color-annotation)}
.later{width:40px;height:6px;border-radius:3px;background:var(--color-annotation);opacity:.5}
.square{width:22px;height:22px;background:color-mix(in srgb,var(--color-annotation) 50%,transparent)}
.ring{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--color-annotation)}
.note{margin-top:16px;font-size:12px;color:var(--color-text-muted);font-style:italic;line-height:1.4}
</style></head><body>
<div class="row">
  <span><span class="solid"></span>playable now</span>
  <span><span class="later"></span>later in the plan</span>
  <span><span class="square"></span>a square</span>
  <span><span class="ring"></span>a piece already there</span>
</div>
<div class="row" style="margin-top:12px"><span>--color-annotation · #9bb26a · <em style="font-family:'DM Sans'">muted olive</em></span></div>
<div class="note">What a Common plan draws on the plans diagram. Never brand orange: orange is a bookmark ribbon, not wallpaper.</div>
</body></html>
