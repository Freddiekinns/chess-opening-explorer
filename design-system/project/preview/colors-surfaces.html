<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.swatch{flex:1;min-width:120px;border-radius:var(--radius-md);padding:14px 16px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:space-between;height:96px}
.swatch .lab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}
.swatch .hex{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary)}
.swatch .name{font-size:13px;color:var(--color-text-primary);font-weight:500}
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#1a1816"><span class="lab">surface · base</span><span class="name">Page</span><span class="hex">#1a1816</span></div>
  <div class="swatch" style="background:#232120"><span class="lab">surface · raised</span><span class="name">Cards</span><span class="hex">#232120</span></div>
  <div class="swatch" style="background:#2c2a27"><span class="lab">surface · elevated</span><span class="name">Topbar / popovers</span><span class="hex">#2c2a27</span></div>
  <div class="swatch" style="background:#363330"><span class="lab">surface · overlay</span><span class="name">Hover highlight</span><span class="hex">#363330</span></div>
</div>
</body></html>
