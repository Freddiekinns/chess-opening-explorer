<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base)}
.row{display:flex;gap:14px}
.col{flex:1}
.t{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.t:last-child{border-bottom:none}
.tk{flex:0 0 120px;font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary)}
.tv{font-size:14px}
.bd{height:36px;border-radius:var(--radius-sm);background:var(--surface-raised);display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--color-text-secondary)}
</style></head><body>
<div class="row">
  <div class="col">
    <div class="t"><span class="tk">--text-primary</span><span class="tv" style="color:#ece8e1">Caro–Kann Defence</span></div>
    <div class="t"><span class="tk">--text-secondary</span><span class="tv" style="color:#9a958e">12,377 games analysed</span></div>
    <div class="t"><span class="tk">--text-muted</span><span class="tv" style="color:#8e887f">Updated 2 days ago</span></div>
    <div class="t"><span class="tk">--text-inverse</span><span class="tv" style="background:#e85d04;color:#100f0e;padding:2px 10px;border-radius:6px;font-weight:600">Surprise me</span></div>
  </div>
  <div class="col">
    <div class="bd" style="border:1px solid rgba(255,255,255,.06)"><span class="tk" style="flex:0 0 130px">--border-subtle 6%</span></div>
    <div class="bd" style="border:1px solid rgba(255,255,255,.10);margin-top:6px"><span class="tk" style="flex:0 0 130px">--border-default 10%</span></div>
    <div class="bd" style="border:1px solid rgba(255,255,255,.18);margin-top:6px"><span class="tk" style="flex:0 0 130px">--border-hover 18%</span></div>
    <div class="bd" style="border:1px solid rgba(255,255,255,.25);margin-top:6px"><span class="tk" style="flex:0 0 130px">--border-strong 25%</span></div>
  </div>
</div>
</body></html>
