<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        padding: 24px;
        background: var(--surface-base);
        font-family: var(--font-family-primary), sans-serif;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .cap {
        display: block;
        font-family: var(--font-family-mono);
        font-size: 10px;
        color: var(--color-text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      /* Level pills (swipeable row on mobile) */
      .pill {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        padding: 8px 15px;
        border-radius: var(--radius-full);
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-text-secondary);
      }
      .pill--active {
        border-color: var(--color-brand-orange);
        background: var(--color-brand-orange);
        color: #100f0e;
      }
      /* Collapsed category trigger */
      .trigger {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 320px;
        padding: 8px 16px;
        border-radius: var(--radius-full);
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--color-border);
        background: transparent;
        color: var(--color-text-secondary);
      }
      .trigger span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .trigger--active {
        border-color: var(--color-brand-orange);
        background: rgba(232, 93, 4, 0.12);
        color: var(--color-text-primary);
        font-weight: 600;
      }
      .trigger--active .chev {
        color: var(--color-brand-orange);
      }
      /* Open dropdown menu */
      .menu {
        width: 260px;
        background: var(--surface-overlay);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-lg);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        font-size: 13px;
        color: var(--color-text-secondary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .item:last-child {
        border-bottom: none;
      }
      .item--active {
        background: rgba(232, 93, 4, 0.1);
        color: var(--color-text-primary);
        font-weight: 600;
      }
      .item--active .check {
        color: var(--color-brand-orange);
      }
      .check {
        opacity: 0;
      }
      .item--active .check {
        opacity: 1;
      }
      svg {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <!-- Mobile-only filter treatment for the Popular openings grid. Level stays
         a swipeable pill row; the long ECO category labels collapse into a
         "Category" dropdown so nothing clips at phone widths. -->
    <div class="row">
      <div>
        <span class="cap">level — swipeable pills</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button class="pill pill--active">All levels</button>
          <button class="pill">Beginner</button>
          <button class="pill">Intermediate</button>
          <button class="pill">Advanced</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <span class="cap">category — trigger (default)</span>
        <button class="trigger">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="7" y1="12" x2="17" y2="12" />
            <line x1="10" y1="18" x2="14" y2="18" />
          </svg>
          <span>Category</span>
          <svg
            class="chev"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>

      <div>
        <span class="cap">category — trigger (active)</span>
        <button class="trigger trigger--active">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="7" y1="12" x2="17" y2="12" />
            <line x1="10" y1="18" x2="14" y2="18" />
          </svg>
          <span>Open Games (C)</span>
          <svg
            class="chev"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>
    </div>

    <div class="row">
      <div>
        <span class="cap">category — open menu</span>
        <div class="menu">
          <div class="item item--active">
            <span>All Openings</span>
            <svg
              class="check"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </div>
          <div class="item"><span>Irregular Openings (A)</span></div>
          <div class="item"><span>Semi-Open Games (B)</span></div>
          <div class="item"><span>Open Games (C)</span></div>
          <div class="item"><span>Closed and Semi-Closed Games (D)</span></div>
          <div class="item"><span>Indian Defences (E)</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
