<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row:last-child{margin:0}
.cap{font-family:var(--font-family-mono);font-size:10px;color:var(--color-text-muted);letter-spacing:.06em;text-transform:uppercase;width:130px}
.eco{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-family:var(--font-family-mono);font-size:11px;font-weight:600;background:#363330;color:#9a958e;border:1px solid rgba(255,255,255,.10);letter-spacing:.5px}
.style{display:inline-flex;align-items:center;padding:4px 12px;border-radius:8px;font-size:12px;background:rgba(232,93,4,.06);color:#8e887f;border:1px solid rgba(255,255,255,.10)}
.cx{display:inline-flex;align-items:center;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid transparent;text-transform:capitalize}
.cx-b{background:rgba(16,185,129,.15);color:rgba(16,185,129,.9);border-color:rgba(16,185,129,.25)}
.cx-i{background:rgba(245,158,11,.15);color:rgba(245,158,11,.9);border-color:rgba(245,158,11,.25)}
.cx-a{background:rgba(239,68,68,.15);color:rgba(239,68,68,.9);border-color:rgba(239,68,68,.25)}
.cx-e{background:rgba(139,92,246,.15);color:rgba(139,92,246,.9);border-color:rgba(139,92,246,.25)}
</style></head><body>
<div class="row"><span class="cap">eco</span><span class="eco">A00</span><span class="eco">B12</span><span class="eco">C45</span><span class="eco">D02</span><span class="eco">E60</span></div>
<div class="row"><span class="cap">style</span><span class="style">Aggressive</span><span class="style">Positional</span><span class="style">Tactical</span><span class="style">Solid</span></div>
<div class="row"><span class="cap">complexity</span><span class="cx cx-b">Beginner</span><span class="cx cx-i">Intermediate</span><span class="cx cx-a">Advanced</span><span class="cx cx-e">Expert</span></div>
</body></html>
