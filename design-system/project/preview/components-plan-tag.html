<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base);font-family:var(--font-family-primary);color:var(--color-text-primary)}
.row{display:flex;align-items:baseline;gap:8px;width:340px;padding:6px 8px;margin-bottom:8px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-sm)}
.san{flex:none;font-family:var(--font-family-mono);font-size:12px;font-weight:600}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--color-text-muted)}
.tag{flex:none;font-size:var(--text-3xs);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--border-default);border-radius:var(--radius-full);padding:1px 6px;color:var(--color-text-muted)}
.tag.plan{color:var(--color-text-secondary);border-color:var(--border-hover)}
.note{margin-top:16px;max-width:340px;font-size:12px;color:var(--color-text-muted);font-style:italic;line-height:1.4}
</style></head><body>
<div class="row"><span class="san">6.Be3</span><span class="name">Najdorf Variation: English Attack</span><span class="tag plan">In White's plan</span></div>
<div class="row"><span class="san">6.Bg5</span><span class="name">Najdorf Variation: Main Line</span></div>
<div class="row"><span class="san">6.h3</span><span class="tag">off-book</span><span class="tag plan">In White's plan</span></div>
<div class="note">Next moves rows only. A move a Common plan names as playable now. Neutral, one notch above the off-book tag, never orange. The opening name truncates first.</div>
</body></html>
