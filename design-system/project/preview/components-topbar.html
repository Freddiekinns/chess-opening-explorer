<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:0;margin:0;background:var(--surface-base);font-family:'DM Sans'}
.bar{position:relative;height:60px;background:#2c2a27;border-bottom:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;gap:16px}
.logo{font-weight:600;font-size:16px;color:#ece8e1;letter-spacing:-.01em}
.nav{display:flex;justify-self:center;gap:16px;height:100%;align-items:stretch}
.nav a{display:flex;align-items:center;padding:0 16px;color:#9a958e;text-decoration:none;font-size:16px;font-weight:500;box-shadow:inset 0 -2px 0 transparent}
.nav a.active{color:#e85d04;box-shadow:inset 0 -2px 0 #e85d04}
.right{justify-self:end;display:flex;gap:12px;align-items:center}
.input{position:relative;width:220px}
.input input{width:100%;padding:6px 32px 6px 12px;background:#1a1816;border:1px solid rgba(255,255,255,.10);border-radius:8px;color:#ece8e1;font-size:13px;outline:none;box-sizing:border-box}
.input svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#9a958e}
.surprise{background:#e85d04;color:#100f0e;border:none;padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
</style></head><body>
<div class="bar">
  <a class="logo" href="#">Opening Book</a>
  <nav class="nav"><a href="#" class="active">Explore</a><a href="#">Analyse</a></nav>
  <div class="right">
    <div class="input"><input placeholder="Search openings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
    <button class="surprise">Surprise me</button>
  </div>
</div>
</body></html>
