<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:20px;background:var(--surface-base)}
.row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.s{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:80px;height:60px;background:#2c2a27;border:1px solid var(--border-default)}
.k{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary)}
.v{font-size:11px;color:var(--color-text-muted)}
</style></head><body>
<div class="row">
  <div class="s"><div class="box" style="border-radius:4px"></div><span class="k">--radius-sm</span><span class="v">4px · pills</span></div>
  <div class="s"><div class="box" style="border-radius:8px"></div><span class="k">--radius-md</span><span class="v">8px · default</span></div>
  <div class="s"><div class="box" style="border-radius:12px"></div><span class="k">--radius-lg</span><span class="v">12px · big cards</span></div>
  <div class="s"><div class="box" style="border-radius:16px"></div><span class="k">--radius-xl</span><span class="v">16px · modal</span></div>
  <div class="s"><div class="box" style="border-radius:9999px"></div><span class="k">--radius-full</span><span class="v">pill toggles</span></div>
</div>
</body></html>
