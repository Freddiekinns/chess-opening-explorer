<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:20px;background:var(--surface-base)}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.s{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{background:#363330;border:1px solid var(--border-default);border-radius:4px}
.k{font-family:var(--font-family-mono);font-size:10px;color:var(--color-text-secondary)}
.v{font-family:'DM Sans';font-size:10px;color:var(--color-text-muted)}
</style></head><body>
<div class="row">
  <div class="s"><div class="box" style="width:2px;height:32px"></div><span class="k">px</span><span class="v">1px</span></div>
  <div class="s"><div class="box" style="width:4px;height:32px"></div><span class="k">0-5</span><span class="v">2</span></div>
  <div class="s"><div class="box" style="width:8px;height:32px"></div><span class="k">1</span><span class="v">4</span></div>
  <div class="s"><div class="box" style="width:12px;height:32px"></div><span class="k">1-5</span><span class="v">6</span></div>
  <div class="s"><div class="box" style="width:16px;height:32px"></div><span class="k">2</span><span class="v">8</span></div>
  <div class="s"><div class="box" style="width:24px;height:32px"></div><span class="k">3</span><span class="v">12</span></div>
  <div class="s"><div class="box" style="width:32px;height:32px"></div><span class="k">4</span><span class="v">16</span></div>
  <div class="s"><div class="box" style="width:48px;height:32px"></div><span class="k">6</span><span class="v">24</span></div>
  <div class="s"><div class="box" style="width:64px;height:32px"></div><span class="k">8</span><span class="v">32</span></div>
  <div class="s"><div class="box" style="width:96px;height:32px"></div><span class="k">12</span><span class="v">48</span></div>
  <div class="s"><div class="box" style="width:128px;height:32px"></div><span class="k">16</span><span class="v">64</span></div>
</div>
</body></html>
