<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{padding:24px;background:var(--surface-base)}
.row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.c{background:#232120;width:140px;height:80px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--border-subtle)}
.c .k{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary)}
.c .v{font-size:10px;color:var(--color-text-muted)}
.s1{box-shadow:0 1px 2px rgba(0,0,0,.2)}
.s2{box-shadow:0 4px 12px rgba(0,0,0,.25)}
.s3{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.s4{box-shadow:0 4px 12px rgba(232,93,4,.30)}
.s5{box-shadow:0 6px 20px rgba(232,93,4,.35);background:#e85d04}
.s5 .k,.s5 .v{color:#100f0e}
</style></head><body>
<div class="row">
  <div class="c s1"><span class="k">shadow-sm</span><span class="v">resting card</span></div>
  <div class="c s2"><span class="k">shadow-md</span><span class="v">hover card</span></div>
  <div class="c s3"><span class="k">shadow-lg</span><span class="v">popover, board</span></div>
  <div class="c s4"><span class="k">shadow-brand</span><span class="v">primary hover</span></div>
  <div class="c s5"><span class="k">shadow-brand-lg</span><span class="v">CTA emphasis</span></div>
</div>
</body></html>
