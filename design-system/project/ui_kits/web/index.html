<!doctype html><html><head><meta charset="utf-8"><title>Opening Book — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="icon" href="../../assets/opening-book-icon.png">
<style>
body{margin:0;background:var(--surface-base);color:var(--color-text-primary);font-family:'DM Sans',sans-serif;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column}

/* TopBar */
.topbar{position:sticky;top:0;height:60px;background:#2c2a27;border-bottom:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;gap:16px;z-index:100}
.logo{justify-self:start;color:#ece8e1;text-decoration:none;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo img{width:24px;height:24px;border-radius:4px}
.nav{display:flex;justify-self:center;gap:0;height:100%;align-items:stretch}
.nav a{display:flex;align-items:center;padding:0 16px;color:#9a958e;text-decoration:none;font-size:16px;font-weight:500;box-shadow:inset 0 -2px 0 transparent;cursor:pointer;transition:all .15s ease}
.nav a:hover{color:#ece8e1}
.nav a.active{color:#e85d04;box-shadow:inset 0 -2px 0 #e85d04}
.right{justify-self:end;display:flex;gap:12px;align-items:center}
.tb-search{position:relative;width:220px}
.tb-search input{width:100%;padding:6px 32px 6px 12px;background:#1a1816;border:1px solid rgba(255,255,255,.10);border-radius:8px;color:#ece8e1;font-size:13px;outline:none;box-sizing:border-box;font-family:'DM Sans'}
.tb-search input:focus{border-color:#e85d04}
.tb-search svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#9a958e;pointer-events:none}
.surprise{background:#e85d04;color:#100f0e;border:none;padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans';transition:opacity .15s}
.surprise:hover{opacity:.9}

/* Hero */
.hero{padding:48px 24px 36px;background:linear-gradient(145deg,#232120 0%,#1a1816 100%);border-bottom:1px solid rgba(232,93,4,.20);text-align:center}
.hero h1{font:800 clamp(36px,6vw,64px)/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;color:#ece8e1;margin:0 0 8px}
.hero h1 i{font-style:normal;color:#e85d04}
.hero .sub{font:400 18px/1.4 'DM Sans',sans-serif;color:#9a958e;margin:0 0 24px}
.hero-search{max-width:560px;margin:0 auto}
.hero-search input{width:100%;padding:14px 20px;font-size:16px;text-align:center;background:linear-gradient(145deg,rgba(232,93,4,.06),transparent);border:1px solid rgba(232,93,4,.20);border-radius:12px;color:#ece8e1;outline:none;font-family:'DM Sans';box-sizing:border-box;transition:border-color .15s}
.hero-search input:focus{border-color:#e85d04}
.hero-search input::placeholder{color:#8e887f;text-align:center}
.pgn{margin-top:14px;color:#9a958e;font-size:13px;background:none;border:none;cursor:pointer;text-decoration:underline;font-family:'DM Sans'}
.pgn:hover{color:#ece8e1}

/* Sections */
.section{max-width:1200px;margin:0 auto;padding:32px 24px;width:100%;box-sizing:border-box}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.section-head h2{font:700 24px/1.35 'Bricolage Grotesque',sans-serif;margin:0;color:#ece8e1}
.section-head .count{font-size:14px;color:#9a958e}

/* Repertoire row */
.scroller{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.rep-card{flex:0 0 240px;background:#363330;border:1px solid rgba(255,255,255,.10);border-radius:8px;overflow:hidden;text-align:left;cursor:pointer;transition:all .15s ease;display:flex;flex-direction:column;color:inherit;font-family:inherit;padding:0}
.rep-card:hover{border-color:#e85d04;transform:translateY(-2px)}
.rep-board{width:100%;aspect-ratio:1;background:#1a1816;position:relative}
.rep-info{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rep-name{font:600 16px/1.35 'DM Sans',sans-serif;margin:0;color:#ece8e1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.star{background:none;border:none;color:#e85d04;cursor:pointer;padding:0;font-size:16px;line-height:1}
.rep-meta{display:flex;gap:8px;align-items:center}
.rep-moves{font-family:var(--font-family-mono);font-size:12px;color:#e85d04;font-weight:500}

/* Pills */
.eco-pill{display:inline-flex;padding:3px 10px;border-radius:8px;font-family:var(--font-family-mono);font-size:11px;font-weight:600;background:#363330;color:#9a958e;border:1px solid rgba(255,255,255,.10);letter-spacing:.5px}
.cx-pill{display:inline-flex;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:500;text-transform:capitalize;border:1px solid transparent}
.cx-beginner{background:rgba(16,185,129,.15);color:rgba(16,185,129,.9);border-color:rgba(16,185,129,.25)}
.cx-intermediate{background:rgba(245,158,11,.15);color:rgba(245,158,11,.9);border-color:rgba(245,158,11,.25)}
.cx-advanced{background:rgba(239,68,68,.15);color:rgba(239,68,68,.9);border-color:rgba(239,68,68,.25)}

/* Popular grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.op-card{background:#232120;border:1px solid #2a2724;border-radius:8px;cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.op-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d4cfc7,#5a554e,#c08840);opacity:0;transition:opacity .3s ease}
.op-card:hover{border-color:#e85d04;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 1px rgba(232,93,4,.12);background:#2c2a27}
.op-card:hover::before{opacity:1}
.op-board{aspect-ratio:1;background:#1a1816}
.op-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.op-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.op-name{font:600 15px/1.3 'DM Sans',sans-serif;margin:0;color:#ece8e1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.op-meta{display:flex;gap:6px;flex-wrap:wrap}
.op-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:4px}
.op-bar .w{background:#d4cfc7}.op-bar .d{background:#5a554e}.op-bar .b{background:#c08840}
.op-labels{display:flex;justify-content:space-between;font-family:var(--font-family-mono);font-size:10px;color:#8e887f}
.op-moves{font-family:var(--font-family-mono);font-size:11px;color:#8e887f}

/* Footer */
footer{margin-top:auto;padding:24px;border-top:1px solid rgba(255,255,255,.06);text-align:center;color:#8e887f;font-size:12px}
footer a{color:#9a958e;text-decoration:none;margin:0 10px}
footer a:hover{color:#ece8e1}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c2a27;border:1px solid rgba(232,93,4,.50);color:#ece8e1;padding:12px 18px;border-radius:8px;font-size:14px;font-family:'DM Sans';box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:200;animation:fadeIn .2s ease;display:none}
.toast.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style></head><body>
<div class="app" id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="MiniBoard.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="OpeningCard.jsx"></script>
<script type="text/babel" src="RepertoireRow.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body></html>
