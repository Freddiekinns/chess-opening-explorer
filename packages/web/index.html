<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/opening-book-icon.png" />
    <link rel="apple-touch-icon" href="/opening-book-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted fonts (see public/fonts/fonts.css) — no third-party
         connection on the critical path; font-display: swap throughout. -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="google-site-verification" content="FlDgVJJGrvhGAyySulgVBiyqQ1Dg6V1T8sg8og-Aisc" />
    <title>Opening Book — Discover, explore and learn chess openings</title>
    <link rel="canonical" href="https://openingbook.xyz/" />
    <meta
      name="description"
      content="Explore 12,000+ chess openings with videos, studies, win rates, and practice tools. Find the perfect opening for your style."
    />
    <meta property="og:url" content="https://openingbook.xyz/" />
    <meta property="og:site_name" content="Opening Book" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Splash palette — Warm Editorial Dark tokens (mirror simplified.css).
         middleware.ts styles its pre-hydration content from these, so a token
         it references has to exist here as well as in simplified.css. */
      :root {
        --surface-base: #1a1816;
        --color-text-primary: #ece8e1;
        --color-text-secondary: #9a958e;
        --color-brand-orange: #e85d04;
      }

      body {
        margin: 0;
        font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--surface-base);
        color: var(--color-text-primary);
        line-height: 1.6;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner */
      .loading-spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        border-top-color: var(--color-brand-orange);
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
